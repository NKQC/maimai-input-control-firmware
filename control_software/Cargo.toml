[workspace]
members = [".", "vcam_source"]

[package]
name = "mai2control-ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "mai2control_ui"
path = "src/lib.rs"

[[bin]]
name = "mai2control-ui"
path = "src/main.rs"

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"

[dependencies]
anyhow = "1.0.103"
env_logger = "0.11.11"
log = "0.4.33"
nusb = "=0.2.4"
serialport = "4.9.0"
slint = "1.17.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 虚拟摄像头: QR 码生成(纯 Rust, 无 C 依赖)。
qrcode = { version = "0.14", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # GetOpenFileNameW/GetSaveFileNameW/OPENFILENAMEW 位于该模块（windows 0.62.2 已核实）。
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
] }

[build-dependencies]
slint-build = "1.17.1"
