[package]
name = "mai2control-ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "mai2control_ui"
path = "src/lib.rs"

[[bin]]
name = "mai2control-ui"
path = "src/main.rs"

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"

[dependencies]
anyhow = "1.0.103"
env_logger = "0.11.11"
log = "0.4.33"
nusb = "=0.2.4"
serialport = "4.9.0"
slint = "1.17.1"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.17.1"
