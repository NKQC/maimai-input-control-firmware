[workspace]
members = ["."]

[package]
name = "mai2control-ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "mai2control_ui"
path = "src/lib.rs"

[[bin]]
name = "mai2control-ui"
path = "src/main.rs"

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"

[dependencies]
anyhow = "1.0.103"
env_logger = "0.11.11"
log = "0.4.33"
nusb = "=0.2.4"
serialport = "4.9.0"
slint = "1.17.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 虚拟摄像头扫码输出: QR 码生成(纯 Rust, 无 C 依赖)。
#
# ★为什么是 qrcodegen 而不是 qrcode★ 本路输出必须与游戏侧实际在用的 QR(见仓库根 sample.jpg)
# 逐模块一致, 否则同一串数据生成出的图样不同, 识别行为就无从对齐。实测(把 sample.jpg 解回模块
# 矩阵逐格比对): 两者的模式选择、版本、纠错级别都能对上, 但 `qrcode` 0.14 的掩码评分挑出的
# 掩码与样本不同 —— 整个数据区因此全不一样, 且该 crate 没有指定掩码的公开入口。
# qrcodegen 是 Nayuki 参考实现的官方 Rust 移植, 其按 ISO/IEC 18004 罚分规则自选的掩码与样本
# 完全一致(实测 diff=0 个模块), 并且允许显式固定掩码与关闭"纠错级别自动提升"。
qrcodegen = "1.8"
windows-core = "=0.62.2"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
    "Win32_Security",
    # 帧共享映射的 SDDL(ConvertStringSecurityDescriptorToSecurityDescriptorW)。
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    # selftest --vcam-probe 走真实 COM 路径构造 DirectShow 过滤器(DllGetClassObject →
    # IClassFactory → IBaseFilter/IMediaFilter), 不经 HKLM 注册。
    "Win32_System_Com",
    "Win32_Media_DirectShow",
    # windows 0.62 把 DirectShow 的 AM_MEDIA_TYPE/IFilterGraph::ConnectDirect 绑定门控在该 feature 下,
    # 同时也是 CLSID_SystemDeviceEnum/CLSID_VideoInputDeviceCategory 常量的来源。
    "Win32_Media_MediaFoundation",
    # selftest --vcam-probe 的系统枚举探针: ICreateDevEnum→IEnumMoniker→IPropertyBag(FriendlyName),
    # 镜像消费端(OBS/游戏)真实枚举路径, 而不是硬编码 CLSID 直连。
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # HID 触控点位页的主屏幕截图: GetDC/CreateCompatibleDC/CreateCompatibleBitmap/
    # BitBlt/GetDIBits/DeleteObject/ReleaseDC 与 BITMAPINFO 全部位于该模块(windows 0.62.2)。
    "Win32_Graphics_Gdi",
    # GetOpenFileNameW/GetSaveFileNameW/OPENFILENAMEW 位于该模块（windows 0.62.2 已核实）。
    "Win32_UI_Controls_Dialogs",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    # CreateFileW/OPEN_EXISTING/FILE_SHARE_*: 键盘接口可开性实测(vcam/keyboard.rs 的
    # `probe_kbd_iface`)。这是判断"选中该设备到底收不收得到数据"的唯一硬判据 ——
    # Raw Input 列表会漏报健康节点, 不能拿它当判据。
    "Win32_Storage_FileSystem",
] }

# ★UI 流畅度的决定性开关★ 实测(main.rs 的 [PROF] gap = 16ms 定时器的实际到达间隔):
# 未优化 dev 构建 gap avg≈140ms(≈7fps, 回调本身只占 4ms ⇒ 时间全在 Slint 渲染里),
# release 构建 gap avg≈17ms(≈60fps)。日常调试跑的就是 dev 构建, 所以必须给它优化:
# 依赖(slint/femtovg/rustybuzz/skrifa 等渲染栈)按 3 级优化, 只编一次;
# 本 crate 用 1 级, 兼顾增量编译速度与可读的调试信息。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
slint-build = "1.17.1"
# 固定资产 Interception.zip 的解包与完整性校验(见 build.rs::embed_interception_assets)。
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
# 把 ui/assets/icon.ico 作为 Win32 图标资源嵌进 exe(资源管理器/任务栏/Alt-Tab 显示)。
# 用 winresource 而非 winres: 后者已不维护, 在 Rust 1.61+ 上失效。
winresource = "=0.1.31"
